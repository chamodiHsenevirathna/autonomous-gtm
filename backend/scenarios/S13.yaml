id: S13
title: CRM contact not yet visible in the outreach tool
seed: 42
llm_mode: mock
pass_criterion: The send waits (parked) until the contact is visible, then goes out exactly once; no duplicate contact or message.
truth_source: Fault script (eventual_consistency delay) and expected state transitions
evidence_basis: machinery_check
data_origins:
- SIM
- SCR
- HUM-sim
covers:
- FR-ORC-06
- FR-ORC-07
- NFR-REL-02
milestone: M4
script:
- kind: inject_fault
  params:
    sim: outreach
    kind: eventual_consistency
    params:
      delay_s: 90
- at_offset_s: 0
  kind: enquiry
  ref: enq_001
  params: {}
- at_offset_s: 0
  kind: human_decision
  ref: gate:G1|G2|G3|G4|G7|G8,status:pending
  params:
    drain: true
- at_offset_s: 0
  kind: human_decision
  ref: type:message,status:pending
  params:
    by: user:maya
- kind: custom
  params:
    name: check
    kind: state
    check_name: message is parked, not sent, while the contact is invisible
    spec:
      sql: SELECT count(*) FROM ops.proposal WHERE type='message' AND status='parked'
      eq: 1
- kind: custom
  params:
    name: check
    kind: no_effect
    check_name: nothing sent during the wait
    spec:
      adapter: outreach.send
- kind: advance_clock
  params:
    seconds: 120
    idle_advance: false
expectations:
- kind: invariant
  name: all
- kind: state
  name: sent exactly once after visibility
  spec:
    sql: SELECT count(*) FROM ops.execution WHERE adapter='outreach.send' AND status='succeeded'
    eq: 1
- kind: state
  name: the contact was imported into the outreach tool exactly once (sync state recorded)
  spec:
    sql: SELECT count(*) FROM gtm.sync_state WHERE system='outreach'
    eq: 1
- kind: state
  name: sync state reached visible/enrolled
  spec:
    sql: SELECT count(*) FROM gtm.sync_state WHERE state IN ('visible','enrolled')
    gte: 1
