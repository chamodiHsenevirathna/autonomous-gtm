expectations:
- kind: invariant
  name: all
- kind: state
  name: meeting recorded
  spec:
    sql: SELECT count(*) FROM gtm.interaction WHERE classification='meeting_booked'
    gte: 1
- kind: state
  name: no sequence step pending
  spec:
    sql: SELECT count(*) FROM ops.proposal WHERE type='sequence_step' AND status='pending'
    eq: 0
- kind: state
  name: still only the first message sent
  spec:
    sql: SELECT count(*) FROM ops.execution WHERE adapter='outreach.send' AND status='succeeded'
    lte: 1
