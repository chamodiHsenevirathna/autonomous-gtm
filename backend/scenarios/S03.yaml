id: S03
title: Fuzzy duplicate (typo, alias domain)
seed: 42
llm_mode: mock
pass_criterion: A match proposal (G1) or merge proposal is raised and awaits a human; no merge is executed automatically; wrong-merge rate is 0.
truth_source: World duplicate_of / duplicate_company_pairs labels
evidence_basis: measured_on_simulation
data_origins:
- GT
- SCR
- MOD
covers:
- FR-INB-02
- FR-DAT-07
milestone: M3
script:
- at_offset_s: 0
  kind: enquiry
  ref: enq_004
  params: {}
- at_offset_s: 3600
  kind: enquiry
  ref: enq_005
  params: {}
expectations:
- kind: invariant
  name: all
- kind: state
  name: a pair proposal is pending
  spec:
    sql: SELECT count(*) FROM ops.proposal WHERE type IN ('match_confirmation','merge') AND status='pending'
    gte: 1
- kind: state
  name: no automatic merge
  spec:
    sql: SELECT count(*) FROM gtm.merge_log
    eq: 0
- kind: state
  name: no entity merged away
  spec:
    sql: SELECT count(*) FROM gtm.account WHERE merged_into_id IS NOT NULL
    eq: 0
- kind: metric
  name: er_wrong_merge_rate
  spec:
    max: 0.0
    allow_none: true
