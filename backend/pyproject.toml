[project]
name = "gtm"
version = "0.1.0"
description = "Autonomous GTM: portfolio case study (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: needs the PostgreSQL test database",
  "live: would call a live model API (always skipped; live calls are disabled)",
]
