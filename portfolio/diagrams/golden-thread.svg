<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 575" width="1240" height="575" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44515f"/></marker></defs><rect width="1240" height="575" fill="#ffffff"/><text x="24" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2430" text-anchor="start">Golden-thread demonstration</text><text x="24" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5a6675" text-anchor="start">One enquiry, end to end, on simulated data. The thread is the same in the dashboard, the audit log and the scenarios.</text><rect x="24" y="96" width="178" height="108" rx="9" fill="#f1ecfb" stroke="#7d56c2" stroke-width="1.6"/><text x="36" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">1. Enquiry arrives</text><text x="36" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">scripted inbound form</text><path d="M 202 150.0 L 222 150.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="222" y="96" width="178" height="108" rx="9" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.6"/><text x="234" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">2. Resolve + enrich</text><text x="234" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">entity resolution,</text><text x="234" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">3 providers + provenance</text><path d="M 400 150.0 L 420 150.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="96" width="178" height="108" rx="9" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.6"/><text x="432" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">3. Research</text><text x="432" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">evidence-linked claims only;</text><text x="432" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">page text is untrusted data</text><path d="M 598 150.0 L 618 150.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="618" y="96" width="178" height="108" rx="9" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.6"/><text x="630" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">4. Qualify</text><text x="630" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">score vs ICP rubric (mock);</text><text x="630" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">unknowns listed</text><path d="M 796 150.0 L 816 150.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="816" y="96" width="178" height="108" rx="9" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.6"/><text x="828" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">5. Route</text><text x="828" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">hard limits only downgrade;</text><text x="828" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">unclear / spam held</text><path d="M 994 150.0 L 1014 150.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1014" y="96" width="178" height="108" rx="9" fill="#fff3dc" stroke="#d98a00" stroke-width="1.6"/><text x="1026" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">6. Human review</text><text x="1026" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">sees exact payload + hash</text><text x="1026" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">nothing sent before approval</text><rect x="24" y="286" width="178" height="108" rx="9" fill="#fff3dc" stroke="#d98a00" stroke-width="1.6"/><text x="36" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">7. Approve one action</text><text x="36" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">approve / edit / reject</text><text x="36" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">single-use, expires</text><path d="M 202 340.0 L 222 340.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="222" y="286" width="178" height="108" rx="9" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.6"/><text x="234" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">8. Gateway re-validates</text><text x="234" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">approval, hash, suppression,</text><text x="234" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">contact state, 13 checks</text><path d="M 400 340.0 L 420 340.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="286" width="178" height="108" rx="9" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.6"/><text x="432" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">9. Adapter executes (SIM)</text><text x="432" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">token required;</text><text x="432" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">contact sync first</text><path d="M 598 340.0 L 618 340.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="618" y="286" width="178" height="108" rx="9" fill="#f1ecfb" stroke="#7d56c2" stroke-width="1.6"/><text x="630" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">10. Scripted reply</text><text x="630" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">router: hard signals first</text><text x="630" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">opt-out / bounce suppress</text><path d="M 796 340.0 L 816 340.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="816" y="286" width="178" height="108" rx="9" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.6"/><text x="828" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">11. Account intelligence</text><text x="828" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">agent state updates, next</text><text x="828" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">action proposed</text><path d="M 994 340.0 L 1014 340.0" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1014" y="286" width="178" height="108" rx="9" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.6"/><text x="1026" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">12. Dashboard</text><text x="1026" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">workflow, decisions, audit,</text><text x="1026" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">evaluation results</text><path d="M 1103.0 204 L 1103.0 258 L 113.0 258 L 113.0 286" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><text x="560" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#44515f" text-anchor="middle" font-style="italic">second row continues</text><rect x="24" y="432" width="1192" height="62" rx="9" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/><text x="36" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">Where the evidence is</text><text x="36" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Each step writes an audit event; the scenario S01 asserts this thread, and the browser tests drive it through the real UI (see portfolio/screenshots/).</text><rect x="24" y="520" width="16" height="16" rx="4" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.5"/><text x="48" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Deterministic code</text><rect x="260" y="520" width="16" height="16" rx="4" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.5"/><text x="284" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Model-backed step (mock here)</text><rect x="496" y="520" width="16" height="16" rx="4" fill="#fff3dc" stroke="#d98a00" stroke-width="1.5"/><text x="520" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Human decision</text><rect x="732" y="520" width="16" height="16" rx="4" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.5"/><text x="756" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Execution gateway</text><rect x="968" y="520" width="16" height="16" rx="4" fill="#f1ecfb" stroke="#7d56c2" stroke-width="1.5"/><text x="992" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Simulated system</text><text x="1216" y="565" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a3b34" text-anchor="end" font-style="italic">Mock model and simulated systems throughout.</text></svg>