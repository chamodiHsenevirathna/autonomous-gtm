s-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">Technical test results (not commercial effectiveness)</text><text x="36" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">28 of 28 end-to-end scenarios pass, 0 regressions vs the frozen baseline</text><text x="36" y="545" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">416 backend tests pass; 13 unit + 9 browser tests (last run 2026-11-06)</text><text x="36" y="562" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Only 41 of 151 requirements have a runnable scenario</text><rect x="630" y="486" width="586" height="104" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.6"/><text x="642" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">What these numbers do not show</text><text x="642" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Real commercial model performance is untested (no live call was ever made).</text><text x="642" y="545" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Labels are partly the author's judgement; 5 cases are deliberately left contested.</text><text x="642" y="562" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">No conversion, revenue or productivity effect is measured.</text><text x="24" y="628" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5a6675" text-anchor="start">Source: model_eval/results/mock_v4/model_eval_report.json (generated by build_diagrams.py). Synthetic data. The account-routing row follows labels derived from the same policy the mock implements.</text></svg>