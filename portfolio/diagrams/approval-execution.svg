<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44515f"/></marker></defs><rect width="1240" height="760" fill="#ffffff"/><text x="24" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2430" text-anchor="start">Approval and execution flow</text><text x="24" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5a6675" text-anchor="start">Why an approved message cannot reach a different address, be sent twice, or bypass the gateway.</text><rect x="24" y="90" width="250" height="100" rx="9" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.6"/><text x="36" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">1. Agent proposes</text><text x="36" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">proposal = type + full payload</text><text x="36" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">hash = SHA-256(proposal id, type,</text><text x="36" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">payload, screen policy version)</text><rect x="24" y="230" width="250" height="108" rx="9" fill="#fff3dc" stroke="#d98a00" stroke-width="1.6"/><text x="36" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">2. Human reviews</text><text x="36" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">sees exact payload and hash</text><text x="36" y="289" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">approve, edit (new hash) or reject</text><text x="36" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">role + separation of duties (service-level;</text><text x="36" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">the demo UI uses one fixed reviewer)</text><rect x="24" y="370" width="250" height="100" rx="9" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.6"/><text x="36" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">3. Approval recorded</text><text x="36" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">single-use, expires (72 h default)</text><text x="36" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">edited payload gets a NEW hash</text><text x="36" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">content screen blocks price / promises</text><path d="M 149 190 L 149 230" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 149 330 L 149 370" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="90" width="400" height="450" rx="9" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.6"/><text x="342" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">4. Execution gateway: 13 canonical checks</text><text x="346" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 1. Approval valid: role, expiry, hash match, unconsumed</text><text x="346" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 2. Experiment holdout (reserved; not enabled)</text><text x="346" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 3. Content screens on the final hash (no price / promises)</text><text x="346" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 4. Recipient resolution and data quality</text><text x="346" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 5. Suppression and do-not-contact pre-check</text><text x="346" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 6. Outreach claims and priority</text><text x="346" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 7. Frequency caps and duplicate-outreach key</text><text x="346" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 8. Human-touch lock</text><text x="346" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start"> 9. Domain breaker</text><text x="346" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start">10. Sync precondition: contact visible in the outreach tool (else PARK)</text><text x="346" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start">11. Suppression re-read under lock (last check before sending)</text><text x="346" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start">12. Adapter call with token; then consume approval, write row</text><text x="346" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#24303c" text-anchor="start">13. Audit event and domain event written</text><text x="346" y="482" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3a6b4a" text-anchor="start" font-style="italic">Check 1 recomputes the hash from the CURRENT recipient.</text><text x="346" y="497" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3a6b4a" text-anchor="start" font-style="italic">A reply that depends on a CRM write waits for it.</text><text x="346" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#3a6b4a" text-anchor="start" font-style="italic">CRM writes skip the message-only checks.</text><path d="M 274 420 L 330 420" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><text x="302" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#44515f" text-anchor="middle" font-style="italic">approved</text><rect x="790" y="90" width="220" height="110" rx="9" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.6"/><text x="802" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">5. Adapter client</text><text x="802" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">verifies the signed token</text><text x="802" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">(HMAC, expiry, adapter)</text><text x="802" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">no token = refused; in-process</text><rect x="790" y="240" width="220" height="90" rx="9" fill="#f1ecfb" stroke="#7d56c2" stroke-width="1.6"/><text x="802" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">6. Simulated system</text><text x="802" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">outreach tool / CRM sim</text><text x="802" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">no real message, no real CRM</text><rect x="790" y="370" width="220" height="140" rx="9" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.6"/><text x="802" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">7. Audit + result</text><text x="802" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">execution record with hash</text><text x="802" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">append-only audit event</text><text x="802" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">hash chain extends</text><text x="802" y="463" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">dashboard shows it</text><path d="M 730 145 L 790 145" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><text x="760" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#44515f" text-anchor="middle" font-style="italic">token</text><path d="M 900 200 L 900 240" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 900 330 L 900 370" fill="none" stroke="#44515f" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1050" y="90" width="166" height="420" rx="9" fill="#fdeceb" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1062" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start">Blocked paths (tested)</text><text x="1062" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">changed recipient</text><text x="1062" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">expired approval</text><text x="1062" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">replayed approval</text><text x="1062" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">wrong hash</text><text x="1062" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">suppression added</text><text x="1062" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">  during the wait</text><text x="1062" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">price in edited text</text><text x="1062" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">call without token</text><text x="1062" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">forged token</text><text x="1062" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">direct adapter call</text><text x="1062" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start"></text><text x="1062" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Each is a scenario</text><text x="1062" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">with an expected</text><text x="1062" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">denial.</text><rect x="24" y="540" width="1192" height="120" rx="9" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/><text x="36" y="562" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#1b2430" text-anchor="start">Design intent</text><text x="36" y="582" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">The approval is bound to what the human saw: for a message the gateway recomputes the hash from the live recipient at execution, so a change after approval is caught.</text><text x="36" y="599" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Safety comes from absent capability, not from prompt instructions: agents have no send, merge or decide tool, and adapter clients need a gateway token (demo-grade, in-process).</text><text x="36" y="616" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Verified by the scenario suite (28/28) and 416 backend tests: technical results on simulated data, not evidence of commercial effect.</text><rect x="24" y="690" width="16" height="16" rx="4" fill="#eef1f5" stroke="#5b6b7b" stroke-width="1.5"/><text x="48" y="703" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Deterministic code</text><rect x="260" y="690" width="16" height="16" rx="4" fill="#e6effd" stroke="#3b6fd4" stroke-width="1.5"/><text x="284" y="703" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Model-backed step (mock here)</text><rect x="496" y="690" width="16" height="16" rx="4" fill="#fff3dc" stroke="#d98a00" stroke-width="1.5"/><text x="520" y="703" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Human decision</text><rect x="732" y="690" width="16" height="16" rx="4" fill="#e3f4e9" stroke="#2e8b57" stroke-width="1.5"/><text x="756" y="703" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Execution gateway</text><rect x="968" y="690" width="16" height="16" rx="4" fill="#f1ecfb" stroke="#7d56c2" stroke-width="1.5"/><text x="992" y="703" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3a4654" text-anchor="start">Simulated system</text><text x="1216" y="740" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a3b34" text-anchor="end" font-style="italic">Simulated systems only. No real message is ever sent.</text></svg>